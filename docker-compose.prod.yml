services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

  financial-coach-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-120b}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY}
      JWKS_URI: ${JWKS_URI:?Set JWKS_URI}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      SERVICES_TRANSACTION_SERVICE_BASE_URL: ${SERVICES_TRANSACTION_SERVICE_BASE_URL:?Set SERVICES_TRANSACTION_SERVICE_BASE_URL}
      SCA_PROVIDER_BASE_URL: ${SCA_PROVIDER_BASE_URL:?Set SCA_PROVIDER_BASE_URL}
      SCA_PROVIDER_API_TOKEN: ${SCA_PROVIDER_API_TOKEN:?Set SCA_PROVIDER_API_TOKEN}
