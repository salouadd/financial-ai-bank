server:
  port: 8082
  shutdown: graceful
  max-http-request-size: ${MAX_HTTP_REQUEST_SIZE:65536}

spring:
  application:
    name: financial-coach-service

  # Configuration PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coach_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: CoachHikariPool

  jpa:
    hibernate:
      ddl-auto: validate # Jamais de ddl-auto update en production bancaire
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  # Sécurité : Validation des tokens émis par identity-service (JWKS)
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  # Moteur IA Spring AI
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.groq.com/openai}
      api-key: ${GROQ_API_KEY:mock-key-for-dev}
      chat:
        options:
          model: ${AI_MODEL:openai/gpt-oss-120b}
          temperature: 0.1 # Zéro créativité/hallucination, rigueur maximale

security:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}

coach:
  rate-limit:
    ai-analyses-per-minute: ${AI_ANALYSES_PER_MINUTE:5}
    salary-detections-per-minute: ${SALARY_DETECTIONS_PER_MINUTE:10}

services:
  sca:
    enabled: ${SCA_PROVIDER_ENABLED:false}
    base-url: ${SCA_PROVIDER_BASE_URL:}
    api-token: ${SCA_PROVIDER_API_TOKEN:}

# Auditing & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized